name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          python-version: "3.11"
          enable-cache: true

      - name: Verify uv version
        run: uv --version

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format
        run: uv run --frozen ruff format --check .

      - name: Static typing
        run: uv run --frozen mypy src tests

      - name: Tests
        run: uv run --frozen pytest

      - name: Offline CPU smoke
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run --frozen unfrozen smoke

      - name: SchemaWorld Core generation and replay smoke
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          uv run --frozen unfrozen generate-core --config configs/experiment/milestone1_core_smoke.yaml
          manifest="$(find runs -mindepth 2 -maxdepth 2 -name core_manifest.json)"
          test -n "$manifest"
          uv run --frozen unfrozen validate-core --manifest "$manifest"
          uv run --frozen unfrozen replay-core --manifest "$manifest"

      - name: Benchmark lifecycle engineering smoke
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          benchmark_tmp="$(mktemp -d)"
          trap 'rm -rf "$benchmark_tmp"' EXIT
          candidate="$benchmark_tmp/private"
          approval="$benchmark_tmp/engineering-approval.json"
          frozen="$benchmark_tmp/frozen"
          uv run --frozen unfrozen build-benchmark \
            --source tests/fixtures/benchmark_lifecycle/source \
            --output "$candidate" \
            --version engineering-benchmark-lifecycle-v1 \
            --purpose engineering
          uv run --frozen unfrozen validate-benchmark \
            --manifest "$candidate/candidate_manifest.json"
          ! grep -E 'correct_option_id|answer_index|expected_answer|gold_label|answer_rationale' \
            "$candidate/public_manifest.json" "$candidate/coverage_summary.json"
          uv run --frozen unfrozen create-engineering-freeze-approval \
            --candidate-manifest "$candidate/candidate_manifest.json" \
            --output "$approval" \
            --signer ci-engineering-fixture
          uv run --frozen unfrozen freeze-benchmark \
            --candidate-manifest "$candidate/candidate_manifest.json" \
            --approval "$approval" \
            --output "$frozen"
          uv run --frozen unfrozen validate-benchmark \
            --manifest "$frozen/frozen_manifest.json"
          if uv run --frozen unfrozen freeze-benchmark \
            --candidate-manifest "$candidate/candidate_manifest.json" \
            --approval "$approval" \
            --output "$frozen"; then
            echo "Repeated freeze unexpectedly succeeded" >&2
            exit 1
          fi
          uv run --frozen unfrozen audit-benchmark-git

      - name: Literal benchmark engineering smoke
        env:
          CUDA_VISIBLE_DEVICES: ""
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          literal_tmp="$(mktemp -d)"
          trap 'rm -rf "$literal_tmp"' EXIT
          source="$literal_tmp/source"
          candidate="$literal_tmp/candidate"
          review="$literal_tmp/review"
          uv run --frozen unfrozen generate-literal-source \
            --config configs/evaluation/m2_2_literal_smoke.yaml \
            --source "$source"
          uv run --frozen unfrozen validate-literal-source --source "$source"
          uv run --frozen unfrozen build-benchmark \
            --source "$source" \
            --output "$candidate" \
            --version engineering-literal-fixture-v1 \
            --purpose engineering
          uv run --frozen unfrozen validate-benchmark \
            --manifest "$candidate/candidate_manifest.json"
          uv run --frozen unfrozen validate-literal-benchmark \
            --source "$source" \
            --candidate-manifest "$candidate/candidate_manifest.json"
          uv run --frozen unfrozen build-literal-review \
            --source "$source" \
            --output "$review"
          uv run --frozen unfrozen validate-literal-review \
            --source "$source" \
            --review "$review"
          uv run --frozen unfrozen audit-benchmark-git
